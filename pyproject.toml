[project]
name = "storm-modeler"
version = "0.1.0"
description = "WxAlerts Storm Modeler — Phase A validation harness for the SCIT (detection_v2) package"
readme = "README.md"
requires-python = ">=3.11"

# Core dependencies — everything required to run the offline/deterministic
# pipeline and the offscreen GUI smoke test (Section 7 validation).
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "shapely>=2.0",
    "pyproj>=3.6",
    "psycopg[binary]>=3.1",
    "structlog>=24.1",
    "PySide6>=6.6",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "vtk>=9.2",
]

[project.optional-dependencies]
# Live data acquisition. These are lazily imported, so the deterministic
# fixture-replay pipeline and the GUI run without them. Install with
# `uv sync --extra live` on a machine with archive (IEM / S3) network access.
live = [
    "arm-pyart>=1.18",
    "boto3>=1.34",
    "s3fs>=2024.2",
    "httpx>=0.27",
    "geopandas>=0.14",
    "zarr>=2.17",
    "netCDF4>=1.6",
    "xarray>=2024.2",
    "h5netcdf>=1.3",
    "goes2go>=2024.5",
]

[project.scripts]
storm-modeler = "storm_modeler.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storm_modeler"]

[tool.pytest.ini_options]
testpaths = ["src/storm_modeler/tests"]
addopts = "-q"
